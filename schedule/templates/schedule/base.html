<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>{% block title %}SAI{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f6fa; color: #1f2933; }
    header { background: #194E83; color: #fff; padding: 16px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 20px; flex: 1; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; }
    nav a { color: #fff; text-decoration: none; font-weight: bold; }
    nav a.active { text-decoration: underline; }
    .user-badge { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 14px; }
    .user-badge span { background: rgba(255, 255, 255, 0.18); padding: 6px 12px; border-radius: 999px; }
    .user-badge a { color: #fff; text-decoration: none; font-weight: bold; }
        main { padding: 24px; }
        .container { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); padding: 24px; }
        .actions { margin: 16px 0; display: flex; gap: 12px; flex-wrap: wrap; }
        .actions a, .actions button { background: #194E83; color: #fff; padding: 8px 16px; border-radius: 4px; border: none; text-decoration: none; cursor: pointer; }
        .actions a.secondary { background: #64748b; }
    a.secondary { display: inline-block; background: #A6A8AB; color: #fff; padding: 8px 16px; border-radius: 4px; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #d9e2ec; padding: 8px; vertical-align: top; }
    td.entry-cell { position: relative; padding-bottom: 36px; }
        th { background: #f0f4f8; text-align: left; }
    .entry { border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; font-size: 13px; line-height: 1.4; border: 1px solid transparent; }
    .entry.inspection { background: #e0f2fe; border-color: #90cdf4; }
    .entry.absence { background: #ffe8d9; border-color: #f6ad55; }
    .entry.status-agendada { border-color: #1f6feb; }
    .entry.status-concluida { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .entry.status-reprovada { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }
        form.inline { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        form.inline label { font-weight: bold; }
        form.inline select, form.inline input { padding: 6px 8px; border-radius: 4px; border: 1px solid #cbd5e1; }
        form.inline button { background: #1f6feb; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .empty { color: #94a3b8; font-style: italic; }
        .breadcrumbs { margin-bottom: 16px; font-size: 14px; }
        .breadcrumbs a { color: #1f6feb; text-decoration: none; }
        .message { background: #fef3c7; padding: 12px; border-radius: 4px; border: 1px solid #fcd34d; margin-bottom: 16px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 999; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; width: 100%; max-width: 520px; border-radius: 8px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2); padding: 24px; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-close { position: absolute; top: 12px; right: 12px; background: #e2e8f0; color: #1f2937; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .field-group { margin-bottom: 16px; }
        .field-group label { font-weight: bold; display: block; margin-bottom: 6px; }
        .field-group input, .field-group select, .field-group textarea { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #cbd5e1; }
        .field-errors { margin-top: 4px; color: #dc2626; font-size: 13px; }
    .cell-action { position: absolute; right: 8px; bottom: 8px; background: #2563eb; color: #fff; border: none; border-radius: 6px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; line-height: 1; box-shadow: 0 2px 4px rgba(15, 23, 42, 0.18); }
    .cell-action:hover { background: #1d4ed8; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <h1>SAI - Sistema de Agendamento de Inspeções</h1>
        <nav>
            <a href="{% url 'schedule:weekly_schedule' %}" class="{% if request.resolver_match.url_name == 'weekly_schedule' %}active{% endif %}">Semanal</a>
            <a href="{% url 'schedule:monthly_schedule' %}" class="{% if request.resolver_match.url_name == 'monthly_schedule' %}active{% endif %}">Mensal</a>
        </nav>
        <div class="user-badge">
            {% if request.user.is_authenticated %}
                <span>{{ request.user.get_username }}</span>
                <a href="{% url 'logout' %}">Encerrar sessão</a>
            {% else %}
                <a href="{% url 'login' %}">Entrar</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
